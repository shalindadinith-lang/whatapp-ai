<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload, Link & QR Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background-color: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #0288d1; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #01579b; }
        #result { margin-top: 30px; display: none; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        #link { word-break: break-all; color: #0288d1; font-weight: bold; }
        #loading { display: none; color: #ff9800; font-weight: bold; }
    </style>
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="container">
    <h2>Image Upload & QR Generator</h2>
    <p>ඉමේජ් එකක් තෝරා Upload බටන් එක ඔබන්න.</p>
    
    <input type="file" id="imageInput" accept="image/*"><br>
    <button id="uploadBtn">Upload & Generate</button>
    
    <p id="loading">Uploading image... Please wait...</p>

    <div id="result">
        <h3>ඔබේ ඉමේජ් එකේ ලින්ක් එක:</h3>
        <a id="link" href="#" target="_blank">ලින්ක් එක මෙතනින්</a>
        
        <h3>QR Code එක:</h3>
        <div id="qrcode"></div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  // Firebase මොඩියුලයන් Import කිරීම
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  // ⚠️ පියවර 1 දී ඔයාට ලැබුණු Firebase Config විස්තර මෙතනට දාන්න
  const firebaseConfig = {
   apiKey: "AIzaSyCp_IQVnoxPKHcpShm2nMQ6v1Dh0GmPTjA",
  authDomain: "secretaryapp-b4d89.firebaseapp.com",
  projectId: "secretaryapp-b4d89",
  storageBucket: "secretaryapp-b4d89.firebasestorage.app",
  messagingSenderId: "288327170368",
  appId: "1:288327170368:web:d21ae8902bf6b63d79e2a5"
  };

  // Firebase Initialize කිරීම
  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);

  // HTML Elements සම්බන්ධ කරගැනීම
  const imageInput = document.getElementById('imageInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const loadingText = document.getElementById('loading');
  const resultDiv = document.getElementById('result');
  const linkAnchor = document.getElementById('link');
  const qrcodeDiv = document.getElementById('qrcode');

  let qrCodeInstance = null;

  uploadBtn.addEventListener('click', async () => {
      const file = imageInput.files[0];
      if (!file) {
          alert("කරුණාකර මුලින්ම ඉමේජ් එකක් තෝරන්න!");
          return;
      }

      // Loading screen එක පෙන්වීම
      loadingText.style.display = "block";
      resultDiv.style.display = "none";
      qrcodeDiv.innerHTML = ""; // පරණ QR කෝඩ් මකා දැමීම

      try {
          // Firebase Storage එක ඇතුලේ අද්විතීය නමකින් (Timestamp එකක් එකතු කරලා) ෆයිල් එකක් සෑදීම
          const storageRef = ref(storage, 'images/' + Date.now() + '_' + file.name);

          // ෆයිල් එක අප්ලෝඩ් කිරීම
          const snapshot = await uploadBytes(storageRef, file);
          
          // අප්ලෝඩ් වුනු ෆයිල් එකේ පොදු ලින්ක් (Public URL) එක ලබා ගැනීම
          const downloadURL = await getDownloadURL(snapshot.ref);

          // ලින්ක් එක HTML එකට දමා පෙන්වීම
          linkAnchor.href = downloadURL;
          linkAnchor.innerText = downloadURL;

          // QR Code එක සෑදීම
          new QRCode(qrcodeDiv, {
              text: downloadURL,
              width: 180,
              height: 180
          });

          // ප්‍රතිඵල තිරයට පෙන්වීම
          loadingText.style.display = "none";
          resultDiv.style.display = "block";

      } catch (error) {
          console.error(error);
          alert("අප්ලෝඩ් වීමේ දෝෂයක් සිදුවුනා: " + error.message);
          loadingText.style.display = "none";
      }
  });
</script>

</body>
</html>
